
jwt:
    expiration-minutes: 60
cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
spring:
  application:
    name: smart-finance
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

app:
  currency:
    default: INR
    supported:
      - code: INR
        symbol: "₹"
        name: Indian Rupee
      - code: USD
        symbol: "$"
        name: US Dollar
      - code: GBP
        symbol: "£"
        name: British Pound	