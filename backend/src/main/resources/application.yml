spring:
  application:
    name: smart-finance
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

app:
  currency:
    default: INR
    supported:
      - code: INR
        symbol: "₹"
        name: Indian Rupee
      - code: USD
        symbol: "$"
        name: US Dollar
      - code: GBP
        symbol: "£"
        name: British Pound
  jwt:
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  statement:
    max-file-size-mb: 5
    max-rows: 5000
    max-files-per-upload: 5
    header-scan-rows: 30